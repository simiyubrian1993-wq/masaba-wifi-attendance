<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>MASABA WiFi Attendance</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">
  <div>
    <strong>MASABA WiFi</strong>
    <small>Employee Attendance</small>
  </div>
  <button id="adminBtn" class="ghost">Admin Login</button>
</header>

<main class="container">

<section id="authView" class="card">
  <h1>MASABA WiFi</h1>
  <p>Employee Attendance System</p>

  <label>Email</label>
  <input id="loginEmail" type="email" placeholder="Enter your email">

  <label>Password</label>
  <input id="loginPassword" type="password" placeholder="Enter your password">

  <button id="loginBtn" class="primary">Login</button>

  <div id="loginStatus" class="status">Please login.</div>
</section>


<section id="employeeView" hidden>

<div class="card">
  <div class="heading">
    <div>
      <h1>Employee Attendance</h1>
      <p id="welcomeText"></p>
    </div>
    <button id="logoutBtn" class="ghost">Logout</button>
  </div>

  <label>Employee Code</label>
  <input id="employeeCode" placeholder="Example: EMP001">

  <div class="actions">
    <button id="signInBtn" class="primary">📍 Sign In</button>
    <button id="signOutBtn" class="danger">🔴 Sign Out</button>
  </div>

  <div id="status" class="status">Ready.</div>

  <video id="video" autoplay playsinline hidden></video>
  <canvas id="canvas" hidden></canvas>
  <img id="preview" alt="Attendance photo" hidden>
</div>

<div class="card">
  <h2>My Attendance History</h2>
  <div id="myHistory">
    <p>No attendance records yet.</p>
  </div>
</div>

</section>


<section id="adminView" hidden>

<div class="card">

<div class="heading">
  <div>
    <h1>Admin Dashboard</h1>
    <p>MASABA WiFi attendance records</p>
  </div>

  <button id="adminLogoutBtn" class="ghost">Logout</button>
</div>

<div id="stats" class="stats"></div>

<div class="tools">
  <input id="filterDate" type="date">
  <button id="exportBtn" class="primary">Export CSV</button>
</div>

<div id="adminTable"></div>

</div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
