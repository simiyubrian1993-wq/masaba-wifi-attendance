<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>MASABA WiFi Attendance</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div><strong>MASABA WiFi</strong><small>Employee Attendance</small></div>
  <button id="adminBtn" class="ghost">Admin</button>
</header>

<main class="container">
<section id="employeeView">
<div class="card">
<h1>Employee Attendance</h1>
<p>Sign in and sign out using your phone. Your GPS location and attendance photo are recorded.</p>

<label for="employeeName">Employee name</label>
<input id="employeeName" placeholder="Enter your full name" autocomplete="name">

<div class="actions">
<button id="signInBtn" class="primary">📍 Sign In</button>
<button id="signOutBtn" class="danger">🔴 Sign Out</button>
</div>

<div id="status" class="status">Ready.</div>
<video id="video" autoplay playsinline hidden></video>
<canvas id="canvas" hidden></canvas>
<img id="preview" alt="Attendance photo" hidden>
</div>

<div class="card">
<h2>My Attendance History</h2>
<div id="myHistory"><p>Enter your name to see records.</p></div>
</div>
</section>

<section id="adminView" hidden>
<div class="card">
<div class="heading">
<div><h1>Admin Dashboard</h1><p>Attendance records stored on this device.</p></div>
<button id="backBtn" class="ghost">Back</button>
</div>
<div id="stats" class="stats"></div>
<div class="tools">
<input id="filterDate" type="date">
<button id="exportBtn" class="primary">Export CSV</button>
<button id="clearBtn" class="danger">Clear Records</button>
</div>
<div id="adminTable"></div>
</div>
</section>
</main>

<div id="adminModal" class="modal" hidden>
<div class="modalBox">
<h2>Admin Login</h2>
<p>Demo PIN: <b>1234</b></p>
<input id="adminPin" type="password" inputmode="numeric" placeholder="Enter PIN">
<div class="actions">
<button id="cancelAdmin" class="ghost">Cancel</button>
<button id="loginAdmin" class="primary">Open Dashboard</button>
</div>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
